<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NBA Draft</title>
</head>
<body style="background:#0b0d12;color:#eee;font-family:system-ui;padding:2rem">
  <h1>NBA Draft – Phase 1</h1>
  <p id="status">Loading data…</p>
  <script type="module">
    import { loadPlayers } from './src/core/data.js';
    const d = await loadPlayers();
    document.getElementById('status').textContent =
      `${d.players.length} players loaded (${d.meta.source})`;
  </script>
</body>
</html>
